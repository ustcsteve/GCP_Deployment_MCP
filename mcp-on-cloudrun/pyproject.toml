[project]
name = "mcp-on-cloudrun"
version = "0.1.0"
description = "Deployment of an MCP server"
readme = "README.md"
authors = [
    { name = "Steve", email = "siqi.steve.li@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp==2.12.4",
]

[project.scripts]
mcp-on-cloudrun = "mcp_on_cloudrun:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
